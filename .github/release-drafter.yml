# Providers are consumed with semver constraints (e.g. `~> 0.1`), so unlike
# the calver used by service repos, the version is resolved from PR labels.
# See AGENTS.md "Pull requests" for when to use which label.
#
# Dependabot adds the org-wide `major`/`minor`/`patch` labels on its own
# (dependabot.yml cannot turn that off), and release-drafter has no label
# negation. So those aliases only drive version resolution, where
# `dependencies` is matched first and stops them from applying.
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  # Changelog sections. `exclusive` makes the first match win, so a PR lands
  # in one section only (`breaking` + `feature` -> Breaking Changes).
  - title: "💥 Breaking Changes"
    semver-increment: "major"
    exclusive: true
    when:
      label: "breaking"
  - title: "🚀 Features"
    semver-increment: "minor"
    exclusive: true
    when:
      labels:
        - "feature"
        - "enhancement"
  - title: "🐛 Bug Fixes"
    semver-increment: "patch"
    exclusive: true
    when:
      labels:
        - "fix"
        - "bug"
  - title: "📖 Documentation"
    semver-increment: "patch"
    exclusive: true
    when:
      label: "documentation"
  - title: "🧰 Maintenance"
    semver-increment: "patch"
    exclusive: true
    when:
      labels:
        - "chore"
        - "dependencies"
        - "patch"
  # Receives unlabelled PRs and PRs labelled only with a `major`/`minor` alias.
  - title: "📦 Other Changes"
    semver-increment: "patch"

  - type: "pre-exclude"
    when:
      label: "skip-changelog"

  # Version resolution for the aliases. The highest increment across these
  # and the changelog sections wins.
  - type: "version-resolver"
    semver-increment: "patch"
    exclusive: true
    when:
      label: "dependencies"
  - type: "version-resolver"
    semver-increment: "major"
    exclusive: true
    when:
      label: "major"
  - type: "version-resolver"
    semver-increment: "minor"
    exclusive: true
    when:
      label: "minor"
  # Fallback bump for a PR matching none of the above.
  - type: "version-resolver"
    semver-increment: "patch"

# Squash-merge titles end in "(#123)"; make that an explicit link so it stays
# clickable in the draft body.
replacers:
  - search: '/\(#(\d+)\)/g'
    replace: '([#$1](https://github.com/Staffbase/terraform-provider-truefoundry/pull/$1))'

template: |
  ## Changes

  $CHANGES
