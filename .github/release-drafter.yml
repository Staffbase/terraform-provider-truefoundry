# Providers are consumed with semver constraints (e.g. `~> 0.1`), so unlike
# the calver used by service repos, the version is resolved from PR labels.
# `major`/`minor`/`patch` are the org-wide labels and act as aliases for the
# semantic ones. See AGENTS.md "Pull requests" for when to use which.
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  # First match wins, so `breaking` outranks the rest.
  - title: "💥 Breaking Changes"
    semver-increment: "major"
    when:
      labels:
        - "breaking"
        - "major"
  - title: "🚀 Features"
    semver-increment: "minor"
    when:
      labels:
        - "feature"
        - "enhancement"
        - "minor"
  - title: "🐛 Bug Fixes"
    semver-increment: "patch"
    when:
      labels:
        - "fix"
        - "bug"
  - title: "📖 Documentation"
    semver-increment: "patch"
    when:
      labels:
        - "documentation"
  - title: "🧰 Maintenance"
    semver-increment: "patch"
    when:
      labels:
        - "chore"
        - "dependencies"
        - "patch"
  - type: "pre-exclude"
    when:
      label: "skip-changelog"
  # Fallback bump for a PR matching none of the above (no rendered section).
  - type: "version-resolver"
    semver-increment: "patch"

# Squash-merge titles end in "(#123)"; make that an explicit link so it stays
# clickable in the draft body.
replacers:
  - search: '/\(#(\d+)\)/g'
    replace: '([#$1](https://github.com/$OWNER/$REPOSITORY/pull/$1))'

template: |
  ## Changes

  $CHANGES
