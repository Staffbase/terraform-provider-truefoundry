---
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    # Explicit labels: a bump must not pick up `major`, which maps to a breaking release.
    labels:
      - "dependencies"
      - "chore"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    # Explicit labels: a bump must not pick up `major`, which maps to a breaking release.
    labels:
      - "dependencies"
      - "chore"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
