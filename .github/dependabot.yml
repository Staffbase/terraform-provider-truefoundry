---
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    # Dependabot still adds `major`/`minor`/`patch` on its own; release-drafter
    # ignores them on `dependencies` PRs, so a bump stays a patch release.
    labels:
      - "dependencies"
      - "chore"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    # Dependabot still adds `major`/`minor`/`patch` on its own; release-drafter
    # ignores them on `dependencies` PRs, so a bump stays a patch release.
    labels:
      - "dependencies"
      - "chore"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
