name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      # goreleaser publishes the GitHub release, which the Terraform Registry ingests
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser needs the full history to build the changelog
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Build & test
        run: make build test

      - name: Import GPG signing key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # Publishing the release-drafter draft in the UI creates the tag and
      # starts this run with a published release that has no artifacts yet.
      # Turn it back into a draft so goreleaser reuses it and publishes it
      # again once the signed artifacts are attached: the Terraform Registry
      # ingests on publish and fails on a release without them.
      # A published release with artifacts is a finished release (e.g. a
      # re-run): redrafting it would hide its assets from the registry.
      - name: Return published release to draft
        run: |
          err="$RUNNER_TEMP/release-view.err"
          if ! info=$(gh release view "$GITHUB_REF_NAME" --json isDraft,assets \
              --jq '"\(.isDraft) \(.assets | length)"' 2>"$err"); then
            grep -q "release not found" "$err" && exit 0
            cat "$err" >&2
            exit 1
          fi
          read -r is_draft assets <<<"$info"
          if [ "$is_draft" = false ] && [ "$assets" -gt 0 ]; then
            echo "::error::$GITHUB_REF_NAME is already published with artifacts"
            exit 1
          fi
          if [ "$is_draft" = false ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
