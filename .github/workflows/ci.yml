name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      # terraform_wrapper must stay off: the acceptance tests and
      # tfplugindocs invoke the real terraform binary from PATH
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Acceptance tests
        run: make testacc

      # docs/ is generated from the provider schema and examples/;
      # fail if a PR changed those without regenerating (make docs)
      - name: Check docs are up to date
        run: |
          make docs
          git diff --exit-code

  auto-merge:
    needs: [test]
    uses: Staffbase/gha-workflows/.github/workflows/template_automerge_dependabot.yml@v15.1.1
    secrets:
      client_id: ${{ vars.STAFFBASE_ACTIONS_CLIENT_ID }}
      private_key: ${{ secrets.STAFFBASE_ACTIONS_PRIVATE_KEY }}
