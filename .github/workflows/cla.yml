# This version of the CLA Assistant uses a GitHub action and local
# storage of the signatures.
# https://github.com/cla-assistant/github-action/

name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  # pull_request_target runs in the base repository, so fork PRs get a token
  # that can comment and store signatures, and the action can rerun the
  # failed check after signing (it only reruns pull_request_target runs).
  # Never check out or run pull request code in this workflow.
  pull_request_target:
    types: [opened,closed,reopened,synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  CLAssistant:
    if: (github.event.issue.pull_request && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')) || github.event_name == 'pull_request_target'
    # The action writes the signatures file with the SHA it read at start and
    # does not retry on conflict, so runs must not overlap.
    concurrency:
      group: cla-signatures
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        uses: iainmcgin/cla-github-action@0d27e5a16278d4adb6b0c4b92f08ad27b0a21dc8 # v3.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with: 
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/Staffbase/terraform-provider-truefoundry/blob/main/CLA.md'
          # branch should not be protected
          branch: 'signatures'
          # Suppress synthetic AI identities surfaced via Co-authored-by
          # trailers (DEV guideline: "Automated AI Attribution in Commits"
          # mandates the trailer). The PR opener still has to sign.
          # Staffbase maintainers (GitHub logins) contribute under their
          # employment contract; remove them when they leave Staffbase.
          allowlist: '0x46616c6b,staust,noreply@anthropic.com,noreply@opencode.ai,copilot@noreply.github.com,*[bot]'
