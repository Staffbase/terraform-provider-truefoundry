apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: terraform-provider-truefoundry
  title: TrueFoundry Terraform Provider
  description: >
    Terraform provider for the TrueFoundry AI Gateway. Manages provider
    accounts (OpenAI, Azure OpenAI, Azure Foundry, AWS Bedrock, virtual
    models), gateway configuration, guardrails, secret stores, and virtual
    accounts as code.
  annotations:
    github.com/project-slug: Staffbase/terraform-provider-truefoundry
  tags:
    - go
    - terraform
    - infrastructure-as-code
    - ai
    - truefoundry
  links:
    - url: https://www.truefoundry.com/docs/ai-gateway/intro-to-llm-gateway
      title: AI Gateway Docs
      icon: docs
spec:
  type: library
  lifecycle: experimental
  system: ai-gateway
